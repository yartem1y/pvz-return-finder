name: Update PVZ data

on:
  workflow_dispatch:
  
  schedule:
    - cron: "7 6 * * *"
      timezone: "Europe/Moscow"

concurrency:
  group: update-pvz-data
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: google-auth
        name: Authenticate to Google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly

      - id: build
        name: Build and validate pvz.json
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          GOOGLE_SPREADSHEET_ID: ${{ vars.GOOGLE_SPREADSHEET_ID }}
          PVZ_REPORT_PATH: ${{ runner.temp }}/pvz-update-report.json
        run: node scripts/update-pvz.mjs

      - id: commit
        name: Commit updated data
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pvz.json
          git commit -m "Update PVZ data"
          git push

      - name: Add commit failure to summary
        if: always() && steps.commit.outcome == 'failure'
        run: |
          echo "## Ошибка публикации" >> "$GITHUB_STEP_SUMMARY"
          echo "JSON сформирован, но GitHub не смог записать его в ветку main. Проверь права GITHUB_TOKEN и защиту ветки." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pvz-update-report-${{ github.run_number }}
          path: ${{ runner.temp }}/pvz-update-report.json
          if-no-files-found: warn
          retention-days: 30

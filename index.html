<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пункты возврата</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./favicon.png">
<style>body{margin:0;background:#f2f2f7}#pvz-ios{border:0!important;border-radius:0!important;min-height:100vh!important}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:2px solid #007aff;outline-offset:3px}@media(max-width:620px){#pvz-ios .pvz-updated{display:block!important;white-space:normal;text-align:right;max-width:155px}#pvz-ios .pvz-section-head{flex-wrap:wrap}}</style>
</head><body>
<div id="pvz-ios" aria-label="Поиск ближайших пунктов возврата">
  <style>
    #pvz-ios {
      --pvz-accent: #d70015;
      --pvz-accent-pressed: #b80012;
      --pvz-bg: light-dark(#f2f2f7, #000000);
      --pvz-surface: light-dark(#ffffff, #1c1c1e);
      --pvz-control: light-dark(#e9e9ee, #2c2c2e);
      --pvz-text: light-dark(#111114, #f5f5f7);
      --pvz-secondary: light-dark(#6e6e73, #98989d);
      --pvz-separator: light-dark(rgba(60, 60, 67, .18), rgba(84, 84, 88, .65));
      --pvz-blue: light-dark(#007aff, #0a84ff);
      --pvz-green: light-dark(#248a3d, #30d158);
      --pvz-orange: light-dark(#c93400, #ff9f0a);
      color-scheme: light dark;
      color: var(--pvz-text);
      background: var(--pvz-bg);
      border: 1px solid var(--pvz-separator);
      border-radius: 14px;
      min-height: 720px;
      overflow: hidden;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #pvz-ios * { box-sizing: border-box; }
    #pvz-ios button,
    #pvz-ios input { font: inherit; }
    #pvz-ios button { -webkit-tap-highlight-color: transparent; }

    #pvz-ios .pvz-bar {
      min-height: 55px;
      padding: 8px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: color-mix(in srgb, var(--pvz-bg) 86%, transparent);
      border-bottom: 1px solid var(--pvz-separator);
    }
    #pvz-ios .pvz-brand { min-width: 0; }
    #pvz-ios .pvz-brand-main {
      font-size: 15px;
      line-height: 1.2;
      font-weight: 500;
    }
    #pvz-ios .pvz-brand-sub,
    #pvz-ios .pvz-updated {
      color: var(--pvz-secondary);
      font-size: 12px;
      line-height: 1.3;
    }
    #pvz-ios .pvz-brand-sub { margin-top: 2px; }
    #pvz-ios .pvz-updated { white-space: nowrap; }

    #pvz-ios .pvz-main {
      width: min(720px, calc(100% - 40px));
      margin: 34px auto 54px;
    }
    #pvz-ios .pvz-title {
      margin: 0;
      max-width: 610px;
      font-size: 29px;
      line-height: 1.14;
      letter-spacing: -.025em;
      font-weight: 500;
    }
    #pvz-ios .pvz-intro {
      margin: 9px 0 25px;
      color: var(--pvz-secondary);
      font-size: 15px;
      line-height: 1.45;
    }

    #pvz-ios .pvz-group {
      overflow: hidden;
      background: var(--pvz-surface);
      border-radius: 12px;
    }
    #pvz-ios .pvz-search {
      padding: 16px;
    }
    #pvz-ios .pvz-label {
      display: block;
      margin: 0 0 8px;
      color: var(--pvz-secondary);
      font-size: 13px;
      line-height: 1.3;
    }
    #pvz-ios .pvz-search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }
    #pvz-ios .pvz-input {
      width: 100%;
      min-width: 0;
      height: 44px;
      padding: 0 13px;
      color: var(--pvz-text);
      background: var(--pvz-control);
      border: 1px solid transparent;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }
    #pvz-ios .pvz-input::placeholder { color: var(--pvz-secondary); }
    #pvz-ios .pvz-input:focus {
      border-color: color-mix(in srgb, var(--pvz-accent) 70%, transparent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--pvz-accent) 13%, transparent);
    }
    #pvz-ios .pvz-submit {
      height: 44px;
      padding: 0 19px;
      color: #ffffff;
      background: var(--pvz-accent);
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
    }
    #pvz-ios .pvz-submit:active { background: var(--pvz-accent-pressed); }
    #pvz-ios .pvz-hint {
      margin-top: 9px;
      color: var(--pvz-secondary);
      font-size: 12px;
      line-height: 1.35;
    }

    #pvz-ios .pvz-output { margin-top: 22px; }
    #pvz-ios .pvz-origin {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 11px;
      align-items: start;
      padding: 15px 16px;
    }
    #pvz-ios .pvz-origin-icon {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      background: var(--pvz-orange);
      font-size: 13px;
      font-weight: 500;
    }
    #pvz-ios .pvz-origin-icon.ok { background: var(--pvz-green); }
    #pvz-ios .pvz-origin-title {
      font-size: 15px;
      line-height: 1.35;
      font-weight: 500;
    }
    #pvz-ios .pvz-origin-text {
      margin-top: 3px;
      color: var(--pvz-secondary);
      font-size: 13px;
      line-height: 1.4;
    }

    #pvz-ios .pvz-section-head {
      min-height: 44px;
      padding: 18px 4px 8px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }
    #pvz-ios .pvz-section-title {
      font-size: 13px;
      line-height: 1.25;
      color: var(--pvz-secondary);
      text-transform: uppercase;
      letter-spacing: .02em;
      font-weight: 500;
    }
    #pvz-ios .pvz-copy-all,
    #pvz-ios .pvz-copy {
      border: 0;
      background: transparent;
      color: var(--pvz-blue);
      cursor: pointer;
      font-weight: 400;
    }
    #pvz-ios .pvz-copy-all {
      padding: 4px 0;
      font-size: 14px;
      white-space: nowrap;
    }

    #pvz-ios .pvz-list { padding-left: 52px; }
    #pvz-ios .pvz-point {
      min-height: 76px;
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding: 12px 16px 12px 0;
      border-top: 1px solid var(--pvz-separator);
    }
    #pvz-ios .pvz-point:first-child { border-top: 0; }
    #pvz-ios .pvz-rank {
      position: absolute;
      left: -36px;
      top: 19px;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--pvz-control);
      color: var(--pvz-secondary);
      font-size: 12px;
      font-weight: 500;
    }
    #pvz-ios .pvz-point-code {
      font-size: 15px;
      line-height: 1.3;
      font-weight: 500;
    }
    #pvz-ios .pvz-address {
      margin-top: 3px;
      color: var(--pvz-secondary);
      font-size: 13px;
      line-height: 1.35;
    }
    #pvz-ios .pvz-point-side {
      min-width: 102px;
      text-align: right;
    }
    #pvz-ios .pvz-distance {
      margin-bottom: 6px;
      color: var(--pvz-secondary);
      font-size: 12px;
      line-height: 1.25;
    }
    #pvz-ios .pvz-copy {
      padding: 3px 0;
      font-size: 13px;
    }

    #pvz-ios .pvz-empty {
      padding: 19px 16px;
    }
    #pvz-ios .pvz-empty-title {
      font-size: 15px;
      line-height: 1.35;
      font-weight: 500;
    }
    #pvz-ios .pvz-empty-text {
      margin-top: 5px;
      color: var(--pvz-secondary);
      font-size: 13px;
      line-height: 1.45;
    }
    #pvz-ios .pvz-script {
      margin-top: 14px;
      padding-top: 13px;
      border-top: 1px solid var(--pvz-separator);
      font-size: 13px;
      line-height: 1.45;
    }
    #pvz-ios .pvz-script-label {
      display: block;
      margin-bottom: 3px;
      color: var(--pvz-secondary);
      font-size: 12px;
    }

    #pvz-ios .pvz-toast {
      position: absolute;
      left: 50%;
      bottom: 22px;
      max-width: calc(100% - 32px);
      padding: 10px 14px;
      color: light-dark(#ffffff, #111114);
      background: light-dark(rgba(32, 32, 34, .94), rgba(245, 245, 247, .94));
      border-radius: 10px;
      opacity: 0;
      transform: translate(-50%, 8px);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
      font-size: 13px;
      white-space: nowrap;
      z-index: 20;
    }
    #pvz-ios .pvz-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #pvz-ios[data-density="compact"] .pvz-point { min-height: 62px; padding-top: 8px; padding-bottom: 8px; }
    #pvz-ios[data-density="compact"] .pvz-rank { top: 14px; }
    #pvz-ios[data-copy="false"] .pvz-copy { display: none; }

    @media (max-width: 620px) {
      #pvz-ios { min-height: 780px; border-radius: 10px; }
      #pvz-ios .pvz-bar { padding: 8px 16px; }
      #pvz-ios .pvz-updated { display: none; }
      #pvz-ios .pvz-main { width: calc(100% - 24px); margin-top: 25px; }
      #pvz-ios .pvz-title { font-size: 25px; }
      #pvz-ios .pvz-search-row { grid-template-columns: 1fr; }
      #pvz-ios .pvz-submit { width: 100%; }
      #pvz-ios .pvz-point {
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
      }
      #pvz-ios .pvz-point-side {
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
      }
      #pvz-ios .pvz-distance { margin: 0; }
    }
  </style>

  <header class="pvz-bar">
    <div class="pvz-brand">
      <div class="pvz-brand-main">Магнит Маркет</div>
      <div class="pvz-brand-sub">Возвраты</div>
    </div>
    <div id="pvz-updated" class="pvz-updated">Данные загружаются</div>
  </header>

  <main class="pvz-main">
    <h1 class="pvz-title">Найти пункт для возврата</h1>
    <p class="pvz-intro">Введите прежний пункт клиента. Покажем до пяти ближайших адресов, где возврат еще принимают.</p>

    <section class="pvz-group pvz-search" aria-label="Поиск исходной точки">
      <label class="pvz-label" for="pvz-query">Код, название или адрес</label>
      <div class="pvz-search-row">
        <input id="pvz-query" class="pvz-input" placeholder="Например, КЗН-1" autocomplete="off" spellcheck="false" aria-describedby="pvz-hint">
        <button id="pvz-submit" class="pvz-submit" type="button">Найти</button>
      </div>
      <div id="pvz-hint" class="pvz-hint">Можно ввести короткое обозначение ПВЗ или часть адреса.</div>
    </section>

    <p id="pvz-data-warning" class="pvz-hint" role="status" hidden></p>
    <section id="pvz-output" class="pvz-output" aria-live="polite"></section>
  </main>
  <div id="pvz-toast" class="pvz-toast" role="status">Адрес скопирован</div>

</div>
<script>

(() => {
  const root = document.getElementById('pvz-ios');
  const input = document.getElementById('pvz-query');
  const output = document.getElementById('pvz-output');
  const submit = document.getElementById('pvz-submit');
  const stamp = document.getElementById('pvz-updated');
  const toast = document.getElementById('pvz-toast');
  let points = [], cities = new Set(), ready = false, shown = [], timer;
  const norm = value => String(value ?? '').trim().toLocaleLowerCase('ru').replace(/ё/g, 'е').replace(/\s+/g, ' ');
  const esc = value => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const typeFor = code => code.includes('^') ? 'yandex_pvz' : code.includes('%') ? 'magnit_store' : code.includes('-') ? 'partner_pvz' : 'unknown';
  function distance(a, b) {
    const rad = n => n * Math.PI / 180;
    const lat = rad(b.latitude-a.latitude), lon = rad(b.longitude-a.longitude);
    const h = Math.sin(lat/2)**2 + Math.cos(rad(a.latitude))*Math.cos(rad(b.latitude))*Math.sin(lon/2)**2;
    return 6371.0088 * 2 * Math.asin(Math.sqrt(Math.min(1, Math.max(0,h))));
  }
  function message(title, text) {
    shown = [];
    output.innerHTML = '<div class="pvz-group pvz-empty"><div class="pvz-empty-title">'+esc(title)+'</div><div class="pvz-empty-text">'+esc(text)+'</div></div>';
  }
  function search() {
    if (!ready) return;
    shown = [];
    const query = norm(input.value);
    if (!query) return message('Введите код или адрес', 'Укажите исходный пункт клиента.');
    const exact = points.find(p => norm(p.code) === query);
    const matches = exact ? [exact] : points.filter(p => norm(p.code).includes(query) || norm(p.address).includes(query));
    if (!matches.length) return message('Точка не найдена', 'Проверьте код или введите часть адреса.');
    if (matches.length > 1) {
      output.innerHTML = '<div class="pvz-section-head"><div class="pvz-section-title">Уточните исходную точку</div></div><div class="pvz-group pvz-list">' +
        matches.slice(0,30).map((p,i) => '<article class="pvz-point"><div class="pvz-rank">'+(i+1)+'</div><div><div class="pvz-point-code">'+esc(p.code)+'</div><div class="pvz-address">'+esc(p.address)+'</div></div><button class="pvz-copy" data-select="'+esc(p.code)+'">Выбрать</button></article>').join('')+'</div><p class="pvz-hint">Найдено: '+matches.length+'. Если нужной точки нет в списке, уточните запрос.</p>';
      return;
    }
    const origin = matches[0];
    if (cities.has(norm(origin.city))) return message('В городе '+origin.city+' нет пунктов возврата', 'Используйте согласованный альтернативный сценарий возврата.');
    const eligible = p => p.is_active && !cities.has(norm(p.city));
    shown = points.filter(eligible).map(p => ({...p, distance: distance(origin,p)})).sort((a,b) => a.distance-b.distance || a.code.localeCompare(b.code,'ru')).slice(0,5);
    if (!shown.length) return message('Нет доступных пунктов возврата', 'В загруженном справочнике нет подходящих активных точек.');
    const title = eligible(origin) ? origin.code+' принимает возвраты' : origin.code+' не принимает возвраты';
    output.innerHTML = '<div class="pvz-group pvz-origin"><div class="pvz-origin-icon'+(eligible(origin)?' ok':'')+'" aria-hidden="true">'+(eligible(origin)?'✓':'!')+'</div><div><div class="pvz-origin-title">'+esc(title)+'</div><div class="pvz-origin-text">'+esc(origin.address)+'</div></div></div>'+
      '<div class="pvz-section-head"><div class="pvz-section-title">Ближайшие пункты</div><button class="pvz-copy-all" type="button">Скопировать все адреса</button></div>'+
      '<div class="pvz-group pvz-list">'+shown.map((p,i) => '<article class="pvz-point"><div class="pvz-rank">'+(i+1)+'</div><div><div class="pvz-point-code">'+esc(p.code)+'</div><div class="pvz-address">'+esc(p.address)+'</div></div><div class="pvz-point-side"><div class="pvz-distance">'+(norm(p.code)===norm(origin.code)?'этот ПВЗ':p.distance.toLocaleString('ru-RU',{maximumFractionDigits:1})+' км')+'</div><button class="pvz-copy" data-copy="'+i+'" aria-label="Скопировать адрес '+esc(p.code)+'">Скопировать</button></div></article>').join('')+
      '</div><p class="pvz-hint">Расстояние по прямой от исходной точки. В списке могут быть пункты в других городах.</p>';
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); }
    catch (_) {
      const helper = document.createElement('textarea');
      helper.value = text; helper.style.position = 'fixed'; helper.style.left = '-9999px';
      document.body.append(helper); helper.select();
      const success = document.execCommand('copy'); helper.remove();
      if (!success) throw new Error('Копирование недоступно');
    }
  }
  function notify(text) {
    toast.textContent = text; toast.classList.add('show');
    clearTimeout(timer); timer = setTimeout(() => toast.classList.remove('show'), 2200);
  }
  submit.addEventListener('click', search);
  input.addEventListener('keydown', e => {if (e.key==='Enter') search();});
  output.addEventListener('click', async e => {
    const selection = e.target.closest('[data-select]');
    if (selection) {input.value = selection.dataset.select; search(); return;}
    const all = e.target.closest('.pvz-copy-all'), one = e.target.closest('[data-copy]');
    if (!all && !one) return;
    try {
      await copy(all ? shown.map((p,i) => (i+1)+'. '+p.address).join('\n') : shown[Number(one.dataset.copy)].address);
      notify(all ? 'Все адреса скопированы' : 'Адрес скопирован');
    } catch (_) {notify('Не удалось скопировать. Выделите адрес вручную.');}
  });
  async function load() {
    submit.disabled = true;
    message('Загружаем справочник', 'Подождите несколько секунд.');
    try {
      const response = await fetch('./pvz.json', {cache: 'no-store'});
      if (!response.ok) throw new Error('Не найден pvz.json. Загрузите его рядом с index.html.');
      const data = await response.json();
      if (data.schema_version !== 1 || !Array.isArray(data.points) || !Array.isArray(data.cities_without_pvz) || !data.cities_without_pvz.every(c=>typeof c==='string')) throw new Error('Неверный формат справочника. Повторите экспорт из таблицы.');
      cities = new Set(data.cities_without_pvz.map(norm));
      const seen = new Set(); let skipped = 0, unknown = 0;
      for (const row of data.points) {
        if (!row || typeof row.code !== 'string' || !row.code.trim() || typeof row.address !== 'string' || !row.address.trim() ||
          typeof row.city !== 'string' || !row.city.trim() || typeof row.latitude !== 'number' || !Number.isFinite(row.latitude) ||
          Math.abs(row.latitude)>90 || typeof row.longitude !== 'number' || !Number.isFinite(row.longitude) || Math.abs(row.longitude)>180) {skipped++;continue;}
        const key=norm(row.code);
        if (seen.has(key)) throw new Error('Повторяется код '+row.code+'. Исправьте дубли в таблице.');
        seen.add(key);
        const inferred = typeFor(row.code);
        const type = typeof row.type==='string' ? row.type : inferred;
        if (type==='unknown' || !['partner_pvz','magnit_store','yandex_pvz'].includes(type)) unknown++;
        points.push({...row,code:row.code.trim(),address:row.address.trim(),is_active:row.is_active===true && type==='partner_pvz' && inferred==='partner_pvz' && !cities.has(norm(row.city))});
      }
      if (!points.length) throw new Error('В справочнике нет корректных точек.');
      const date = typeof data.updated_at === 'string' && /(Z|[+-]\d{2}:\d{2})$/.test(data.updated_at) ? new Date(data.updated_at) : new Date(NaN);
      stamp.textContent = Number.isNaN(date.getTime()) ? 'Время обновления не указано' : 'Данные от '+new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(date)+' МСК';
      stamp.title = 'Время формирования JSON из Google Таблицы';
      ready = true; submit.disabled = false;
      message('Справочник загружен', 'Введите код или адрес прежнего пункта клиента.');
      if (skipped || unknown) {
        const warning=document.getElementById('pvz-data-warning');
        warning.hidden=false;
        warning.textContent='Проверьте данные: неизвестных типов – '+unknown+' (неактивны), строк с ошибками – '+skipped+' (пропущены).';
      }
    } catch(error) {
      stamp.textContent='Данные не загружены';
      message('Не удалось загрузить справочник', location.protocol==='file:' ? 'Откройте страницу на GitHub Pages. Загрузка pvz.json при открытии HTML с диска может блокироваться браузером.' : error.message);
    }
  }
  load();
})();

</script>
</body></html>
